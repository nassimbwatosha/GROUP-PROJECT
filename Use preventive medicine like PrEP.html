    <h1>Preventive medecine</h1>
    <p> <h2>- Preventive medecine for HIV include PrEP (Daily pill) ; This is like a shield that stops the virus from establish itself in your body.
          </h2>
        <h3>- PEP (medication after explosure) ;involve taking medication within 72 hours to prevent infection.</h3>
        <h4> -Safe sex practices (condoms) ;using condoms consistently and correctly during sex is primary way to prevent HIV transmission. </h4>
        <h5>-needle safety regular testing ; if you use injectable drugs never share needles or syringes.</h5>
        <h6>-Treatment as Prevention (TasP); if someone with HIV takes their medeication consistently ana achieves an undectectable viral load, they can not transmit the virus to others. </h6>
